name: Refresh official organ events

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-organ-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Pull and validate the published calendar
        working-directory: the-openorgan-project
        run: |
          node scripts/refresh-events.mjs --if-changed
          node scripts/test-content.mjs
      - name: Save verified snapshot
        run: |
          snapshot=the-openorgan-project/src/data/events-snapshot.json
          if git diff --quiet -- "$snapshot"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$snapshot"
          git commit -m 'Refresh verified organ recital calendar'
          git push origin HEAD:main
