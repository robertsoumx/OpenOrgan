name: Refresh official organ events

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/refresh-organ-events.yml'
      - 'the-openorgan-project/src/lib/event*.mjs'
      - 'the-openorgan-project/src/data/events-snapshot.json'
      - 'the-openorgan-project/scripts/refresh-events.mjs'
      - 'the-openorgan-project/scripts/test-content.mjs'

permissions:
  contents: read

concurrency:
  group: official-organ-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Test calendar parsing and failure recovery
        working-directory: the-openorgan-project
        run: node --test scripts/test-content.mjs
      - name: Refresh independent official calendars
        working-directory: the-openorgan-project
        run: node scripts/refresh-events.mjs --if-changed
      - name: Validate refreshed calendar
        working-directory: the-openorgan-project
        run: node --test scripts/test-content.mjs
      - name: Save verified snapshot
        if: github.event_name != 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          snapshot=the-openorgan-project/src/data/events-snapshot.json
          if git diff --quiet -- "$snapshot"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$snapshot"
          git commit -m 'Refresh verified organ event calendars'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
